[tox]
envlist = py310-sql, py310-nosql, py310-dynamodb
skipsdist = True

[testenv]
deps =
    -r requirements.txt
    pytest-cov
setenv =
    PYTHONPATH = {toxinidir}/main/python

commands =
    pytest --cov=main --cov-report=term-missing {posargs:tests/python}

[testenv:py310-sql]
setenv =
    PYTHONPATH = {toxinidir}/main/python
    DB_ENGINE = SQL
    DATABASE_URL = sqlite+aiosqlite:///:memory:
commands =
    pytest --cov=main --cov-report=term-missing tests/python/sql  -q 
    pytest --cov=main --cov-report=term-missing tests/python/api  -q 
    pytest --cov=main --cov-report=term-missing tests/python/services -q


[testenv:py310-dynamodb]
setenv =
    PYTHONPATH = {toxinidir}/main/python
    DB_ENGINE = DYNAMODB
    AWS_ACCESS_KEY_ID = testing
    AWS_SECRET_ACCESS_KEY = testing
commands =
    pytest --cov=main --cov-report=term-missing tests/python/dynamodb -q

[testenv:py310-dynamodb-api]
